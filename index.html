<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Invisible</title>
<meta name="description" content="Invisible. Poemario.">
<meta name="theme-color" content="#0b0b0a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;1,6..96,400&family=IBM+Plex+Mono:wght@300;400&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;1,6..72,300;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- PORTADA + ÍNDICE -->
<main id="home">
  <section class="cover wrap">
    <div class="bar mono"><span>Poemario</span><span id="count"></span></div>
    <h1 class="title">Invisible</h1>
    <div class="foot mono"><span>Poemas y escritos</span><a href="#indice">Índice</a></div>
  </section>

  <section class="index wrap" id="indice">
    <h2>Índice</h2>
    <ol class="list" id="list"></ol>
  </section>

  <footer class="wrap" style="padding-block:0 2rem">
    <div class="bar mono" style="border-bottom:0;border-top:1px solid var(--line);padding:1rem 0 0"><span>Invisible</span><span id="year"></span></div>
  </footer>
</main>

<!-- LECTURA -->
<main id="reader" class="read wrap" hidden>
  <div class="bar mono"><a href="#indice" id="back">Índice</a><span id="pos"></span></div>
  <article class="piece" id="piece"></article>
  <nav class="pager mono" id="pager" aria-label="Navegación entre textos"></nav>
</main>

<script src="poemas.js"></script>
<script src="app.js"></script>
</body>
</html>
